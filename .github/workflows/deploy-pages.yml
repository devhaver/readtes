# Deploys the prerendered static site to GitHub Pages on every push to main.
#
# Hosting decision (2026-08-11): GitHub Pages stores the site (1GB limit, no
# file-count cap — fits the full multi-language corpus, unlike Cloudflare
# Pages' 20,000-file free tier), with Cloudflare in front via DNS for CDN
# caching, redirect rules, and custom headers. `public/_headers` is a
# Cloudflare Pages artifact that GitHub Pages ignores; header behaviour is
# configured in Cloudflare instead.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_SITE_URL: https://readtes.com
      # Full-corpus prerender needs headroom beyond the default heap.
      NODE_OPTIONS: --max-old-space-size=6144
      # Umami analytics, env-gated: both empty (unset repo variables) means
      # the site ships with analytics off — same behaviour as a local build.
      # Set the two repository variables (Settings → Secrets and variables →
      # Actions → Variables) to enable it; they are public values that end
      # up in the shipped HTML, so Variables (not Secrets) is the right home.
      NUXT_PUBLIC_UMAMI_SRC: ${{ vars.NUXT_PUBLIC_UMAMI_SRC }}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NUXT_PUBLIC_UMAMI_WEBSITE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@nuxt/fonts` downloads every subset from Google at build time, and a
      # single 404 from `fonts.gstatic.com` fails the whole deploy — it did,
      # for a commit with nothing wrong with it, and a re-run of the same SHA
      # then succeeded (issue #121). A failed deploy is also invisible from
      # the outside: `main` has merged and the site simply keeps serving the
      # previous build.
      #
      # The cache is the module's own download cache, so a warm run needs no
      # font network at all. Keyed on the font configuration: change a family
      # or a subset and the key changes, so a stale cache can never mask a
      # config that no longer fetches what it should.
      - name: Restore font download cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/nuxt/fonts
          key: nuxt-fonts-${{ hashFiles('nuxt.config.ts') }}
          restore-keys: |
            nuxt-fonts-

      - name: Generate static site
        run: pnpm generate

      # The Hebrew families ship zero glyphs if their subsets are ever
      # dropped, and nothing errors when that happens (see the `tes-seo-ssg`
      # skill). A build that silently lost its fonts should not deploy.
      - name: Verify font output
        run: node scripts/verify-font-output.mjs

      # The Actions-based Pages deploy serves the artifact verbatim (no
      # Jekyll pass), but the marker costs nothing and guards the
      # underscore-prefixed /_nuxt and /_fonts dirs against any future
      # branch-based deployment mode.
      - name: Add .nojekyll
        run: touch .output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

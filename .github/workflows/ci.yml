name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Full project gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_SITE_URL: https://readtes.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # Mirrors `task check`. `verify-font-output` sits after `generate` for
      # the reason it exists: every way the fonts go missing leaves the build
      # succeeding and the site silently wrong (issue #121).
      - name: Run full project gate
        run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm validate:content && pnpm test && pnpm generate && node scripts/verify-font-output.mjs

      - name: Run browser acceptance tests
        run: pnpm test:e2e

      - name: Retain deployable static site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: readtes-static-${{ github.sha }}
          path: .output/public
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

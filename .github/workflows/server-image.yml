# Builds the Node server image (Dockerfile target `server`) on every push to
# main and publishes it to GitHub Container Registry, for Coolify to run —
# see docs/deploy-coolify.md.
#
# Built here rather than on the Coolify host: even with reader pages rendered
# on request, `nuxt build` wants a few GB of memory, and a small VPS should
# spend its RAM serving, not building. GitHub's runners for public repos have
# 16 GB.
#
# After a push, Coolify is told to redeploy when the two secrets below are set
# (Coolify → the resource → Webhooks): COOLIFY_WEBHOOK (the deploy URL) and
# COOLIFY_TOKEN (an API token with deploy permission). Unset, the image is
# still published and Coolify can pull it on its own schedule.
name: Server image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: server-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          build-args: |
            NUXT_PUBLIC_SITE_URL=https://readtes.com
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Coolify to redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: ${{ env.COOLIFY_WEBHOOK != '' && env.COOLIFY_TOKEN != '' }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}"

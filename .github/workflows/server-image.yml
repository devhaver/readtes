# Builds the Node server image (Dockerfile target `server`) after CI passes on
# main and publishes it to GitHub Container Registry, for Coolify to run — see
# docs/deploy-coolify.md. Manual runs remain available for recovery.
#
# Built here rather than on the Coolify host: even with reader pages rendered
# on request, `nuxt build` wants a few GB of memory, and a small VPS should
# spend its RAM serving, not building. GitHub's runners for public repos have
# 16 GB.
#
# After a push, Coolify is told to redeploy through its authenticated deploy
# webhook. Both COOLIFY_WEBHOOK and COOLIFY_TOKEN are required repository
# secrets; a missing secret fails the release instead of silently leaving the
# newly published image undeployed.
name: Server image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and publish
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: true
          build-args: |
            NUXT_PUBLIC_SITE_URL=https://readtes.com
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Coolify to redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK}" ] || [ -z "${COOLIFY_TOKEN}" ]; then
            echo "COOLIFY_WEBHOOK and COOLIFY_TOKEN must both be configured" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}"
